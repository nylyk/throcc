[workspace]
members = ["crates/throcc-proto", "crates/throcc-server", "crates/throcc-client-core", "crates/throcc-cli", "crates/throcc-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize", "pkcs8", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.10.2"
rcgen = "0.14.8"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.24.0"
thiserror = "2.0.20"
throcc-client-core = { path = "crates/throcc-client-core" }
throcc-proto = { path = "crates/throcc-proto" }
throcc-server = { path = "crates/throcc-server" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
