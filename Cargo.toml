[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
throcc-proto = { path = "crates/throcc-proto" }
throcc-crypto = { path = "crates/throcc-crypto", default-features = false }
throcc-client-core = { path = "crates/throcc-client-core" }

aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
anyhow = "1.0.104"
arc-swap = "1.9.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
directories = "6.0.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false }
keyring = "4.2.0"
libc = "0.2.191"
hex = "0.4.3"
global-hotkey = "0.8.0"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "runtime_shaders"] }
hkdf = "0.13.0"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
hmac = "0.13.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = "1.12.0"
quinn = { version = "0.11.12", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
ropus = "0.12.18"
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
rtrb = "0.3.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
sonora = "0.2.0"
sonora-common-audio = "0.2.0"
sonora-agc2 = "0.2.0"
sonora-simd = "0.2.0"
spake2 = "0.4.0"
subtle = "2.6.1"
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
smallvec = "1.16.4"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = { version = "1.9.1", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
