[package]
name = "throcc-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
media = ["dep:hpke", "dep:aes-gcm"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
hpke = { workspace = true, optional = true }
sha2.workspace = true
spake2.workspace = true
thiserror.workspace = true
throcc-proto.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rand_core.workspace = true
ring.workspace = true
# Runs the media and HPKE tests in `cargo test -p throcc-crypto` too. Dev-dependency features
# reach only test builds, so the server still builds this crate without `media`.
throcc-crypto = { workspace = true, features = ["media"] }
