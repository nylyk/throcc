[package]
name = "throcc-client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
ffmpeg = ["throcc-video/ffmpeg"]

[dependencies]
throcc-proto.workspace = true
throcc-crypto = { workspace = true, features = ["media"] }
throcc-video.workspace = true
anyhow.workspace = true
bytes.workspace = true
rtrb.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
quinn.workspace = true
ropus.workspace = true
sonora.workspace = true
sonora-agc2.workspace = true
sonora-common-audio.workspace = true
sonora-simd.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
thiserror.workspace = true
image = { workspace = true, features = ["gif", "bmp", "webp"] }
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
cpal.workspace = true
directories.workspace = true
keyring.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring-core.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store.workspace = true
objc2-audio-toolbox.workspace = true
objc2-core-audio-types.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
futures-core.workspace = true
async-io.workspace = true
libc.workspace = true
pipewire.workspace = true

[dev-dependencies]
libc.workspace = true
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_WinRT_Graphics_Capture"] }
