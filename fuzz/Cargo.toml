[package]
name = "throcc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
throcc-proto = { path = "../crates/throcc-proto" }
throcc-client-core = { path = "../crates/throcc-client-core" }
throcc-crypto = { path = "../crates/throcc-crypto", features = ["media"] }

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly"
path = "fuzz_targets/reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fingerprint"
path = "fuzz_targets/fingerprint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invite"
path = "fuzz_targets/invite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_open"
path = "fuzz_targets/media_open.rs"
test = false
doc = false
bench = false
