[package]
name = "throcc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
throcc-proto = { path = "../crates/throcc-proto" }
throcc-client-core = { path = "../crates/throcc-client-core" }

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly"
path = "fuzz_targets/reassembly.rs"
test = false
doc = false
bench = false
