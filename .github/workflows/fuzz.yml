name: fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Nightlies from 2026-10-30 on fail to compile zbus with a query cycle in zvariant_utils.
env:
  NIGHTLY: nightly-2026-10-29

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fingerprint, framing, handshake, header, invite, media_open, reassembly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo "+$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - run: cargo "+$NIGHTLY" fuzz run ${{ matrix.target }} -- -max_total_time=600
        working-directory: fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
