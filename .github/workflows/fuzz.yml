name: fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

# Nightlies from 2026-10-30 on fail to compile zbus with a query cycle in zvariant_utils.
env:
  NIGHTLY: nightly-2026-10-29

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fingerprint, framing, handshake, header, invite, media_open, reassembly]
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo "+$NIGHTLY" install cargo-fuzz --locked
      - run: cargo "+$NIGHTLY" fuzz run ${{ matrix.target }} -- -max_total_time=600
        working-directory: fuzz
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
