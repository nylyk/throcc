name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: ./scripts/check-server-deps.sh
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test --workspace --no-fail-fast
        shell: bash
      - run: ./scripts/ci-run.sh cargo test --release -p throcc-cli --test media
        shell: bash

  video:
    runs-on: macos-26
    env:
      FFMPEG_PKG_CONFIG_PATH: /opt/homebrew/opt/ffmpeg@8/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
      - run: brew update && brew install ffmpeg@8
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh cargo clippy -p throcc-client -p throcc-client-core -p throcc-cli --features ffmpeg --all-targets -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test -p throcc-client-core -p throcc-cli --features ffmpeg
        shell: bash

  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-run.sh tests/netem/run.sh
        shell: bash

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-run.sh tests/deploy/run.sh
        shell: bash

  server-binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/deploy/Dockerfile.static --build-arg TARGET=${{ matrix.target }} -t throcc-static .
      - run: |
          docker create --name copy throcc-static
          docker cp copy:/throcc-server throcc-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: throcc-server-${{ matrix.target }}
          path: throcc-server-${{ matrix.target }}
          retention-days: 7

  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install dav1d pkgconf
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh packaging/macos/bundle.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: throcc-macos
          path: target/macos/throcc.dmg
          retention-days: 7
