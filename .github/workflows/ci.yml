name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: ./scripts/check-server-deps.sh
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
            features: --features throcc-client/ffmpeg,throcc-cli/ffmpeg
            ffmpeg_pkg_config: /opt/homebrew/opt/ffmpeg@8/lib/pkgconfig
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      FFMPEG_PKG_CONFIG_PATH: ${{ matrix.ffmpeg_pkg_config }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'macOS'
        run: brew update && brew install ffmpeg@8
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config mesa-vulkan-drivers
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test --workspace --no-fail-fast ${{ matrix.features }}
        shell: bash
      - run: ./scripts/ci-run.sh cargo test --release -p throcc-cli --test media ten_seconds_of_frames_at_20_mbps_arrive_intact
        shell: bash

  linux-video:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_DLL_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/lib
      FFMPEG_BINDING_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/binding.rs
      LD_LIBRARY_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/lib
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config libva-dev libdav1d-dev libvpx-dev nasm
      - id: versions
        run: echo "libs=$(pkg-config --modversion libva dav1d vpx | tr '\n' '-')" >>"$GITHUB_OUTPUT"
      - id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: deps/ffmpeg-lgpl
          key: linux-ffmpeg-${{ steps.versions.outputs.libs }}-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*', 'packaging/ffmpeg/bindings.sh') }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        name: ffmpeg
        run: |
          ./scripts/ci-run.sh packaging/ffmpeg/build.sh deps/ffmpeg-lgpl
          ./scripts/ci-run.sh cargo install bindgen-cli --version 0.72.1 --locked
          ./scripts/ci-run.sh packaging/ffmpeg/bindings.sh deps/ffmpeg-lgpl deps/ffmpeg-lgpl/binding.rs
        shell: bash
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/ffmpeg-lgpl
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - run: ./scripts/ci-run.sh cargo clippy -p throcc-client-core --features ffmpeg --all-targets -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test -p throcc-client-core --features ffmpeg --lib -- vaapi gpu_input
        shell: bash

  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config mesa-vulkan-drivers sway grim fonts-dejavu-core
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh tests/surface/run.sh
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surface
          path: target/surface/*.ppm
          retention-days: 7

  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/ci-run.sh tests/netem/run.sh
        shell: bash
