name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: ./scripts/check-server-deps.sh
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            grep -E "^test .* FAILED|panicked at|^thread .* panicked" -A2 test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: cargo test --release (throughput)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p throcc-cli --test media 2>&1 | tee release.log || {
            grep -E "^test .* FAILED|panicked at|^thread .* panicked" -A2 release.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/netem/run.sh
