name: ci

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: ./scripts/check-server-deps.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS links dav1d and libvpx statically, built from source.
      - if: runner.os == 'macOS'
        id: codecs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/codecs
          key: codecs-macos-${{ hashFiles('packaging/codecs/*') }}
      - if: runner.os == 'macOS' && steps.codecs.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          packaging/codecs/build.sh deps/codecs aarch64-apple-darwin
      - if: runner.os == 'macOS' && steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/codecs
          key: ${{ steps.codecs.outputs.cache-primary-key }}
      - if: runner.os == 'macOS'
        run: packaging/codecs/env.sh deps/codecs >>"$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config mesa-vulkan-drivers
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: ./scripts/ci-run.sh cargo clippy --locked --workspace --all-targets ${{ matrix.features }} -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test --locked --workspace --no-fail-fast ${{ matrix.features }}
        shell: bash
      # libtest passes when a filter matches nothing, so check the test ran.
      - run: |
          ./scripts/ci-run.sh cargo test --release -p throcc-cli --test media -- --exact ten_seconds_of_frames_at_15_mbps_arrive_intact
          grep -q ' 1 passed;' ci-run.log || { echo "::error::the throughput test did not run"; exit 1; }
        shell: bash
      - if: runner.os == 'Linux'
        run: ./scripts/ci-run.sh cargo check --locked --manifest-path fuzz/Cargo.toml --target-dir target
        shell: bash

  linux-video:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_DLL_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/lib
      FFMPEG_BINDING_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/binding.rs
      LD_LIBRARY_PATH: ${{ github.workspace }}/deps/ffmpeg-lgpl/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config libva-dev libdav1d-dev libvpx-dev nasm
      - id: versions
        run: echo "libs=$(pkg-config --modversion libva dav1d vpx | tr '\n' '-')" >>"$GITHUB_OUTPUT"
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/ffmpeg-lgpl
          key: linux-ffmpeg-${{ steps.versions.outputs.libs }}-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*', 'packaging/ffmpeg/bindings.sh') }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        name: ffmpeg
        run: |
          ./scripts/ci-run.sh packaging/ffmpeg/build.sh deps/ffmpeg-lgpl
          ./scripts/ci-run.sh cargo install bindgen-cli --version 0.72.1 --locked
          ./scripts/ci-run.sh packaging/ffmpeg/bindings.sh deps/ffmpeg-lgpl deps/ffmpeg-lgpl/binding.rs
        shell: bash
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/ffmpeg-lgpl
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - run: ./scripts/ci-run.sh cargo clippy -p throcc-video -p throcc-client-core --features throcc-client-core/ffmpeg --all-targets -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test -p throcc-video --features ffmpeg --lib
        shell: bash
      - run: ./scripts/ci-run.sh cargo clippy -p throcc-video --features software --all-targets -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh cargo test -p throcc-video --features software --lib
        shell: bash
      - run: ./scripts/ci-run.sh cargo test -p throcc-client-core --features ffmpeg --lib -- media::share
        shell: bash

  mobile:
    name: mobile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-26
            targets: aarch64-apple-ios aarch64-apple-ios-sim
            cargo: cargo
            target_flags: --target aarch64-apple-ios --target aarch64-apple-ios-sim
          - platform: android
            os: ubuntu-latest
            targets: aarch64-linux-android x86_64-linux-android
            cargo: cargo ndk -t arm64-v8a -t x86_64 -P 31
    runs-on: ${{ matrix.os }}
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"
      - id: codecs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/codecs
          key: codecs-${{ matrix.platform }}-${{ hashFiles('packaging/codecs/*') }}
      - if: steps.codecs.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install meson ninja
          else
            sudo apt-get update && sudo apt-get install -y meson ninja-build nasm
          fi
          packaging/codecs/build.sh deps/codecs ${{ matrix.targets }}
      - if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/codecs
          key: ${{ steps.codecs.outputs.cache-primary-key }}
      - run: packaging/codecs/env.sh deps/codecs >>"$GITHUB_ENV"
      - run: ./scripts/ci-run.sh ${{ matrix.cargo }} clippy --locked -p throcc-mobile ${{ matrix.target_flags }} -- -D warnings
        shell: bash
      - run: ./scripts/ci-run.sh ${{ matrix.cargo }} build --locked -p throcc-mobile ${{ matrix.target_flags }}
        shell: bash

  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev \
            libegl-dev libssl-dev libzstd-dev pkg-config mesa-vulkan-drivers sway grim fonts-dejavu-core
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: ./scripts/ci-run.sh tests/surface/run.sh
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface
          path: target/surface/*.ppm
          retention-days: 7

  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/ci-run.sh tests/netem/run.sh
        shell: bash
