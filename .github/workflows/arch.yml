name: arch

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/ci-run.sh tests/arch/run.sh out
        shell: bash
      - run: sha256sum throcc-x86_64.pkg.tar.zst >throcc-x86_64.pkg.tar.zst.sha256
        working-directory: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: out/throcc-x86_64.pkg.tar.zst*
          retention-days: 1

  # Only main publishes: a dispatch on another branch builds and checks, nothing more.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never cancelled halfway, which could leave a half-updated nightly release.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-package
          path: out
      - name: Publish to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly"
          notes="Built from $GITHUB_SHA. Install on Arch: curl -LO $base/throcc-x86_64.pkg.tar.zst -LO $base/throcc-x86_64.pkg.tar.zst.sha256 && sha256sum -c throcc-x86_64.pkg.tar.zst.sha256 && sudo pacman -U throcc-x86_64.pkg.tar.zst"
          files=(out/throcc-x86_64.pkg.tar.zst out/throcc-x86_64.pkg.tar.zst.sha256)
          # Updated in place, never deleted, so a failed run keeps the release and its tag. --clobber
          # deletes each old asset before uploading the new one, so a failed upload can leave the
          # package missing, or not matching its .sha256, until the next run.
          # The tag moves so it and the source archives point at the commit built.
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${files[@]}" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --target "$GITHUB_SHA" --notes "$notes" "${files[@]}"
          fi
