name: packaging

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packaging/**'
      - 'crates/throcc-client-core/src/media/video/**'
      - 'crates/throcc-client-core/src/media/capture/**'
      - 'scripts/ci-run.sh'
      - '.github/workflows/packaging.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install dav1d libvpx pkgconf
      - id: dav1d
        run: echo "version=$(brew list --versions dav1d libvpx | tr ' \n' '--')" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/ffmpeg-lgpl
          key: macos-ffmpeg-${{ steps.dav1d.outputs.version }}-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*') }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ./scripts/ci-run.sh packaging/macos/bundle.sh
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: throcc-macos
          path: target/macos/throcc.dmg
          retention-days: 7

  windows-app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: windows-deps-nv13.0.19.0-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*', 'packaging/ffmpeg/bindings.sh', 'packaging/windows/build-deps.sh', 'packaging/windows/requirements.txt') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: choco install nasm --no-progress -y
      - if: steps.deps.outputs.cache-hit != 'true'
        name: dav1d
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          ./scripts/ci-run.sh packaging/windows/build-deps.sh
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils nasm patch pkgconf git
      - if: steps.deps.outputs.cache-hit != 'true'
        name: ffmpeg
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe
          git clone --depth 1 --branch n13.0.19.0 https://github.com/FFmpeg/nv-codec-headers target/nv-codec-headers
          test "$(git -C target/nv-codec-headers rev-parse HEAD)" = e844e5b26f46bb77479f063029595293aa8f812d
          make -C target/nv-codec-headers install PREFIX="$(cygpath -m "$PWD/deps")"
          export PKG_CONFIG_PATH="$(cygpath -m "$PWD/deps/lib/pkgconfig")"
          ./scripts/ci-run.sh packaging/ffmpeg/build.sh deps/ffmpeg-lgpl
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.deps.outputs.cache-hit != 'true'
        name: bindings
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          ./scripts/ci-run.sh cargo install bindgen-cli --version 0.72.1 --locked
          ./scripts/ci-run.sh packaging/ffmpeg/bindings.sh deps/ffmpeg-lgpl deps/ffmpeg-lgpl/binding.rs
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: package
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          ./scripts/ci-run.sh pwsh -NoProfile -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: throcc-windows
          path: target/windows/throcc-windows.zip
          retention-days: 7
      - name: video tests
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PWD/deps/ffmpeg-lgpl/bin:$PWD/deps/bin:$PATH"
          export FFMPEG_DLL_PATH="$(cygpath -w "$PWD/deps/ffmpeg-lgpl/bin")"
          export FFMPEG_BINDING_PATH="$(cygpath -w "$PWD/deps/ffmpeg-lgpl/binding.rs")"
          ./scripts/ci-run.sh cargo test --release -p throcc-client-core --features ffmpeg --lib video:: -- --test-threads=1 --nocapture
