name: packaging

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packaging/**'
      - 'crates/throcc-client-core/src/media/video/**'
      - 'crates/throcc-client-core/src/media/capture/**'
      - 'tests/arch/**'
      - 'tests/deploy/**'
      - 'crates/throcc-server/Dockerfile'
      - 'scripts/ci-run.sh'
      - '.github/workflows/packaging.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-run.sh tests/deploy/run.sh
        shell: bash

  server-binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/deploy/Dockerfile.static --build-arg TARGET=${{ matrix.target }} -t throcc-static .
      - run: |
          docker create --name copy throcc-static
          docker cp copy:/throcc-server throcc-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: throcc-server-${{ matrix.target }}
          path: throcc-server-${{ matrix.target }}
          retention-days: 7

  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install dav1d libvpx pkgconf
      - id: dav1d
        run: echo "version=$(brew list --versions dav1d libvpx | tr ' \n' '--')" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps/ffmpeg-lgpl
          key: macos-ffmpeg-${{ steps.dav1d.outputs.version }}-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*') }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-run.sh packaging/macos/bundle.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: throcc-macos
          path: target/macos/throcc.dmg
          retention-days: 7

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/ci-run.sh tests/arch/run.sh
        shell: bash

  windows-app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: windows-deps-nv13.0.19.0-${{ hashFiles('packaging/ffmpeg/build.sh', 'packaging/ffmpeg/patches/*', 'packaging/ffmpeg/bindings.sh', 'packaging/windows/build-deps.sh') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: choco install nasm --no-progress -y
      - if: steps.deps.outputs.cache-hit != 'true'
        name: dav1d
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          ./scripts/ci-run.sh packaging/windows/build-deps.sh
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils nasm patch pkgconf git
      - if: steps.deps.outputs.cache-hit != 'true'
        name: ffmpeg
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe
          git clone --depth 1 --branch n13.0.19.0 https://github.com/FFmpeg/nv-codec-headers target/nv-codec-headers
          make -C target/nv-codec-headers install PREFIX="$(cygpath -m "$PWD/deps")"
          export PKG_CONFIG_PATH="$(cygpath -m "$PWD/deps/lib/pkgconfig")"
          ./scripts/ci-run.sh packaging/ffmpeg/build.sh deps/ffmpeg-lgpl
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - if: steps.deps.outputs.cache-hit != 'true'
        name: bindings
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          ./scripts/ci-run.sh cargo install bindgen-cli --version 0.72.1 --locked
          ./scripts/ci-run.sh packaging/ffmpeg/bindings.sh deps/ffmpeg-lgpl deps/ffmpeg-lgpl/binding.rs
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: package
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          ./scripts/ci-run.sh pwsh -NoProfile -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: throcc-windows
          path: target/windows/throcc-windows.zip
          retention-days: 7
      - name: video tests
        shell: bash
        run: |
          export PATH="$(dirname "$(command -v cl)"):$PWD/deps/ffmpeg-lgpl/bin:$PWD/deps/bin:$PATH"
          export FFMPEG_DLL_PATH="$(cygpath -w "$PWD/deps/ffmpeg-lgpl/bin")"
          export FFMPEG_BINDING_PATH="$(cygpath -w "$PWD/deps/ffmpeg-lgpl/binding.rs")"
          ./scripts/ci-run.sh cargo test --release -p throcc-client-core --features ffmpeg --lib video:: -- --test-threads=1 --nocapture
