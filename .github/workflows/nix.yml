name: nix

on:
  push:
    branches: [develop]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/*/build.rs'
      - '.cargo/**'
      - 'third_party/**'
      - 'packaging/ffmpeg/**'
      - '.github/workflows/nix.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/*/build.rs'
      - '.cargo/**'
      - 'third_party/**'
      - 'packaging/ffmpeg/**'
      - '.github/workflows/nix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build -L .#client .#server .#cli
      - run: |
          ./result-1/bin/throcc-server --help >/dev/null
          ./result-2/bin/throcc-cli --help >/dev/null
